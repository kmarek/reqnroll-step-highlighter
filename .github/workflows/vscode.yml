# Build the VS Code extension on every change; publish to the VS Code Marketplace when a tag vscode-v<version> is pushed.
#
# Release:  git tag vscode-v0.1.0 && git push origin vscode-v0.1.0
# The version comes from the tag (Marketplace accepts only major.minor.patch, no "-beta" suffixes).
#
# Publishing uses Marketplace Trusted Publishing (no token stored in GitHub):
#   https://marketplace.visualstudio.com/manage → publisher "kmarek" → Trusted Publishing → Create:
#   repository owner "kmarek", repository "reqnroll-step-highlighter", workflow "vscode.yml", environment empty.

name: VS Code extension

on:
  push:
    branches: [main]
    tags: ['vscode-v*']
    paths:
      - 'vscode/**'
      - '.github/workflows/vscode.yml'
  pull_request:
    paths:
      - 'vscode/**'
      - '.github/workflows/vscode.yml'
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: vscode

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: vscode/package-lock.json

      - run: npm ci

      - name: Set version from tag
        if: startsWith(github.ref, 'refs/tags/vscode-v')
        run: |
          version="${GITHUB_REF#refs/tags/vscode-v}"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Tag must look like vscode-v1.2.3, got: ${GITHUB_REF#refs/tags/}"
            exit 1
          fi
          npm version "$version" --no-git-tag-version --allow-same-version

      # vscode:prepublish runs the type check and the minified esbuild bundle.
      - name: Package
        run: npx vsce package --no-dependencies -o reqnroll-step-highlighter.vsix

      - uses: actions/upload-artifact@v4
        with:
          name: vsix
          path: vscode/reqnroll-step-highlighter.vsix
          if-no-files-found: error

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/vscode-v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # OIDC token for Marketplace Trusted Publishing
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: vscode/package-lock.json

      - run: npm ci

      - uses: actions/download-artifact@v4
        with:
          name: vsix
          path: vscode

      - name: Publish to VS Code Marketplace
        run: npx vsce publish --oidc --packagePath reqnroll-step-highlighter.vsix
