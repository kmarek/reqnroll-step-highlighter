# Build the Reqnroll plugin on every change; publish to nuget.org when a tag plugin-v<version> is pushed.
#
# Release:  git tag plugin-v0.1.0 && git push origin plugin-v0.1.0
# The version comes from the tag (the <Version> in the .csproj is only a local default).
#
# Publishing uses nuget.org Trusted Publishing (no API key stored in GitHub):
#   nuget.org → account → Trusted Publishing → policy: owner "kmarek", repository "reqnroll-step-highlighter",
#   workflow file "plugin.yml", environment empty.
#   GitHub → Settings → Secrets and variables → Actions → secret NUGET_USER = nuget.org username (not e-mail).

name: Plugin (NuGet)

on:
  push:
    branches: [main]
    tags: ['plugin-v*']
    paths:
      - 'plugin/**'
      - '.github/workflows/plugin.yml'
  pull_request:
    paths:
      - 'plugin/**'
      - '.github/workflows/plugin.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  PROJECT: plugin/StepHighlighter.ReqnrollPlugin/StepHighlighter.ReqnrollPlugin.csproj
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Determine version
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/plugin-v* ]]; then
            version="${GITHUB_REF#refs/tags/plugin-v}"
            if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
              echo "::error::Tag must look like plugin-v1.2.3 or plugin-v1.2.3-beta.1, got: ${GITHUB_REF#refs/tags/}"
              exit 1
            fi
          else
            version="0.0.0-ci.${GITHUB_RUN_NUMBER}"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Version: $version"

      - name: Pack
        run: dotnet pack "$PROJECT" -c Release -o artifacts -p:Version=${{ steps.version.outputs.version }}

      # Reqnroll loads runtime plugins only from files named *.ReqnrollPlugin.dll – guard against renames.
      - name: Check package content
        run: |
          unzip -l artifacts/*.nupkg | tee /dev/stderr | grep -q 'lib/netstandard2.0/StepHighlighter.ReqnrollPlugin.dll' \
            || { echo "::error::Plugin assembly missing or renamed in the package"; exit 1; }

      - uses: actions/upload-artifact@v4
        with:
          name: nuget-package
          path: |
            artifacts/*.nupkg
            artifacts/*.snupkg
          if-no-files-found: error

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/plugin-v')
    runs-on: ubuntu-latest
    permissions:
      id-token: write # OIDC token for nuget.org Trusted Publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: nuget-package
          path: artifacts

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: NuGet login (OIDC → temporary API key, valid 1 h)
        id: login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}

      # The .snupkg next to the .nupkg is pushed automatically.
      - name: Push to nuget.org
        run: >
          dotnet nuget push "artifacts/*.nupkg"
          --api-key ${{ steps.login.outputs.NUGET_API_KEY }}
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate
